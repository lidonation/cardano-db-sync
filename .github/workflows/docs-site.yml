name: Documentation site

# B02 — the CI spine for the docs site. Five stages (SPECIFICATION §12): formatting, static
# analysis, unit tests, link checking and the asset budget. Later items add checks to these stages
# rather than new workflows. `Docs CI gate` is the single check to require on protected branches.

on:
  push:
    branches: [master, release/community-site, docs-rebuild-spec]
    paths:
      - "docs/**"
      - ".github/workflows/docs-site.yml"
      - ".github/scripts/blacksmith-*.py"
      - ".github/scripts/blacksmith-*.pem"
      - ".github/tests/test_blacksmith_*.py"
      - ".github/workflows/blacksmith-*.yml"
      # B44-b release history is counted from this committed source.
      - "cardano-db-sync/CHANGELOG.md"
      # read by check:config (CON-4)
      - "config/mainnet-config.yaml"
      - "config/preprod-config.yaml"
      # check:renames verifies the rename map against these files (GDE-9)
      - "schema/**"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-site.yml"
      - ".github/scripts/blacksmith-*.py"
      - ".github/scripts/blacksmith-*.pem"
      - ".github/tests/test_blacksmith_*.py"
      - ".github/workflows/blacksmith-*.yml"
      # B44-b release history is counted from this committed source.
      - "cardano-db-sync/CHANGELOG.md"
      # read by check:config (CON-4)
      - "config/mainnet-config.yaml"
      - "config/preprod-config.yaml"
      # check:renames verifies the rename map against these files (GDE-9)
      - "schema/**"
  # docs-i18n.yml dispatches this on the Crowdin translations branch, whose pull request is opened
  # by GITHUB_TOKEN and so triggers nothing on its own.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: docs

jobs:
  # Fork-only selection: PRs receive only a trusted, non-secret budget decision.
  site-runner:
    name: Choose balanced runner
    uses: ./.github/workflows/blacksmith-selector.yml
    permissions:
      contents: read
      actions: read

  format:
    name: Format
    needs: site-runner
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.site-runner.outputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docs-setup
      - name: Prettier (BLD-1)
        run: npm run format:check

  static-analysis:
    name: Static analysis
    needs: site-runner
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.site-runner.outputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docs-setup
      - name: Runner selector and CI policy regressions
        working-directory: .
        run: python3 -m unittest discover -s .github/tests -v
      - name: ESLint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: No hardcoded environment values (ENV-1)
        run: npm run check:baseurl
      - name: Style gates (FLOOR-4, FLOOR-8, PERF-3, PERF-5, DF-1, TOK-1, TOK-4, TOK-5)
        run: npm run check:css
      - name: Annotation artifact is consumable (CON-1)
        run: npm run check:annotations
      - name: Config the site hands out is config db-sync reads (CON-4)
        run: npm run check:config
      - name: Rename map is consumable (CON-1, GDE-9)
        run: npm run check:renames
      - name: Schema artifact is sound (SCH-1, GDE-6)
        run: npm run check:schema
      - name: Guide locks and body references (GDE-3, GDE-7)
        run: npm run check:guide-locks
      - name: Tokens regenerate byte-identically (THM-2, DF-1, DF-11)
        run: npm run check:tokens
      - name: Token lint (THM-4, TOK-1, TOK-10, TOK-12)
        run: npm run check:token-lint
      - name: Dependencies pinned, survey set review-gated (SEC-5, SEC-6)
        run: npm run check:deps
      - name: No unreviewed high or critical advisory (SEC-5)
        run: npm run check:audit
      - name: Only the current line is translatable (VER-2)
        run: npm run check:i18n

      # VER-5: the route manifest is append-only. Base is the PR base, or the commit a push replaced.
      # The checkout is shallow, so fetch just the base commit rather than the repo's full history.
      - name: Route manifest is append-only (VER-5)
        run: |
          if [ -n "$MANIFEST_BASE_REF" ] && ! printf '%s' "$MANIFEST_BASE_REF" | grep -Eq '^0+$'; then
            git fetch --no-tags --depth=1 origin "$MANIFEST_BASE_REF"
          fi
          npm run check:manifest
        env:
          MANIFEST_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

  unit-tests:
    name: Unit tests
    # Keep the paired unit job on GitHub Ubuntu 24.04 for Playwright.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tag trees are inputs to the version matrix
      - uses: ./.github/actions/docs-setup
      - name: Version matrix regenerates from tag trees (VER-1, VER-3)
        run: npm run check:versions
      - name: Unit tests with coverage thresholds
        run: npm test
      # B29: the component inventory in a browser — served by the development server only, audited
      # with axe in four palettes at three widths, every manifest state rendered, keyboard behaviour.
      # The Chromium build is the one @playwright/test pins, not the runner's browser.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Pagefind version isolation and identifier regression (SRCH-10, SRCH-11)
        run: npm run test:pagefind:built
      - name: Components (THM-5, THM-6, FLOOR-4, FLOOR-5, DF-2, DF-4, A11Y-28, NAV-3)
        run: npm run test:components
      - name: Built code highlighting (B51)
        run: npm run test:prism:built
      - name: Built switchers (THM-1, A11Y-29, locale navigation)
        run: npm run test:switchers:built
      - name: Built multi-version header (B57, DF-7)
        run: npm run test:versions:built
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-results
          path: docs/test-results/
          retention-days: 7

  build:
    name: Build both profiles
    needs: site-runner
    if: ${{ !cancelled() }}
    # Browser tests install the same pinned Playwright release as unit-tests.
    runs-on: ${{ needs.site-runner.outputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docs-setup
      # A failed upstream checkout must not prevent a cached or unavailable build.
      - name: Check out upstream full history
        uses: actions/checkout@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          repository: IntersectMBO/cardano-db-sync
          ref: master
          fetch-depth: 0
          path: upstream-cardano-db-sync
          persist-credentials: false
      - name: Restore roadmap cache
        uses: actions/cache@v4
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: docs/.cache/roadmap
          key: roadmap-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            roadmap-v1-${{ runner.os }}-
      - name: Restore repository activity cache
        uses: actions/cache@v4
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: docs/.cache/repository-activity
          key: repository-activity-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            repository-activity-v1-${{ runner.os }}-
      # B01 DoD: both profiles build clean from one working tree, the developer output carries no
      # CNAME, the production output does, and a broken Markdown file fails the build.
      # Under CI the build checks the route manifest instead of writing it, and fails listing any
      # published route the committed manifest does not account for (VER-5).
      - name: Build and profile assertions
        run: npm run test:build
        env:
          REPOSITORY_CHECKOUT: ${{ github.workspace }}/upstream-cardano-db-sync
          GITHUB_TOKEN: ${{ github.token }}
      # B43: run against both profiles' actual static CSP-protected HTML, not the dev server.
      - name: Install Chromium for built landing and chrome
        run: npx playwright install --with-deps chromium
      # Landing tests assert the fixed repository fixture, not the live checkout used above.
      # Keep fixture outputs outside docs/build, which is uploaded and checked downstream.
      - name: Build deterministic browser fixtures
        run: |
          npm run build:dev -- --out-dir .cache/browser-fixtures/dev
          npm run build:prod -- --out-dir .cache/browser-fixtures/prod
        env:
          REPOSITORY_ACTIVITY_CACHE: test/fixtures/repository-activity
      - name: Pagefind on both shipped profiles and all locales (SRCH-10, SEC-2)
        run: npm run test:pagefind:profiles
      - name: Landing on shipped assets (B44-a, PERF-1, A11Y-18)
        run: npm run test:landing:built
        env:
          DBS_LANDING_BUILT_BUILD_ROOT: .cache/browser-fixtures
      - name: Global accessibility chrome (A11Y-2..5, A11Y-12, A11Y-14/15/17/21, FLOOR-4/7)
        run: npm run test:chrome
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-keyboard-recordings
          path: docs/test-results/chrome-*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/build/
          include-hidden-files: true
          retention-days: 7

  links:
    name: Link check
    needs: [build, site-runner]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ needs.site-runner.outputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docs-setup
        with:
          install: "false"
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs/build/
      - name: Internal links resolve in every profile (BLD-3)
        run: node scripts/check-links.mjs
      - name: Every page under its CSP, no external origin (SEC-1, SEC-2, SEC-3)
        run: node scripts/check-csp.mjs

  asset-budget:
    name: Asset budget
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docs-setup
        with:
          install: "false"
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs/build/
      - name: Gzip byte budget per profile (PERF-1)
        # An explicit `shell: bash` runs with `-o pipefail`. The default shell does not, so without
        # it `tee` would hide the gate's exit code and an over-budget build would pass.
        shell: bash
        run: node scripts/check-asset-budget.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  gate:
    name: Docs CI gate
    if: always()
    needs: [format, static-analysis, unit-tests, build, links, asset-budget]
    runs-on: ubuntu-latest
    steps:
      - name: Every stage passed
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Stage results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A docs CI stage did not pass ($result)."
              exit 1
            fi
          done

  # B41 / ENV-6: one repository, one Pages site, one profile.
  #   - The fork (lidonation) publishes the developer profile from release/community-site only,
  #     through the `github-pages` environment.
  #   - Upstream (IntersectMBO) publishes the production profile from master only, through the
  #     `production` environment, whose required reviewers approve each deploy (B48 cutover).
  # Both run after the Docs CI gate. The shared steps, including the BLD-1 size and timeout checks,
  # live in .github/actions/docs-deploy. Environment and Pages settings: docs/RUNBOOK.md.
  deploy-dev:
    name: Deploy developer site to Pages
    needs: gate
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success' &&
      github.repository != 'IntersectMBO/cardano-db-sync' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/release/community-site' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # A failed upstream checkout must not prevent a cached or unavailable build.
      - name: Check out upstream full history
        uses: actions/checkout@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          repository: IntersectMBO/cardano-db-sync
          ref: master
          fetch-depth: 0
          path: upstream-cardano-db-sync
          persist-credentials: false
      - name: Restore roadmap cache
        uses: actions/cache@v4
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: docs/.cache/roadmap
          key: roadmap-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            roadmap-v1-${{ runner.os }}-
      - name: Restore repository activity cache
        uses: actions/cache@v4
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: docs/.cache/repository-activity
          key: repository-activity-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            repository-activity-v1-${{ runner.os }}-
      - id: deploy
        uses: ./.github/actions/docs-deploy
        env:
          REPOSITORY_CHECKOUT: ${{ github.workspace }}/upstream-cardano-db-sync
          GITHUB_TOKEN: ${{ github.token }}
        with:
          profile: dev

  deploy-production:
    name: Deploy production site to Pages
    needs: gate
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success' &&
      github.event_name == 'push' &&
      github.repository == 'IntersectMBO/cardano-db-sync' &&
      github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # A failed upstream checkout must not prevent a cached or unavailable build.
      - name: Check out upstream full history
        uses: actions/checkout@v4
        continue-on-error: true
        timeout-minutes: 5
        with:
          repository: IntersectMBO/cardano-db-sync
          ref: master
          fetch-depth: 0
          path: upstream-cardano-db-sync
          persist-credentials: false
      - name: Restore roadmap cache
        uses: actions/cache@v4
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: docs/.cache/roadmap
          key: roadmap-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            roadmap-v1-${{ runner.os }}-
      - name: Restore repository activity cache
        uses: actions/cache@v4
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: docs/.cache/repository-activity
          key: repository-activity-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            repository-activity-v1-${{ runner.os }}-
      - id: deploy
        uses: ./.github/actions/docs-deploy
        env:
          REPOSITORY_CHECKOUT: ${{ github.workspace }}/upstream-cardano-db-sync
          GITHUB_TOKEN: ${{ github.token }}
        with:
          profile: prod

  activity-alert:
    name: Scheduled activity ops alert
    needs: [gate, deploy-dev]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.repository == 'lidonation/cardano-db-sync' &&
      github.ref == 'refs/heads/release/community-site'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/docs-ops-alert.yml
    with:
      result: ${{ needs.gate.result != 'success' && needs.gate.result || needs.deploy-dev.result }}
