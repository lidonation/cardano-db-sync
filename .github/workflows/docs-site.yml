# TEMPLATE: install this file on the default branch as .github/workflows/docs-site.yml.
# GitHub schedules only default-branch workflows and only dispatches workflows registered there.
name: Weekly community site rebuild
on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    name: Start the release-branch documentation workflow
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$REPO/actions/workflows/docs-site.yml/dispatches" -f ref=release/community-site
  alert:
    name: Ops alert
    needs: dispatch
    if: always()
    uses: lidonation/cardano-db-sync/.github/workflows/docs-ops-alert.yml@release/community-site
    permissions:
      contents: read
      issues: write
    with:
      result: ${{ needs.dispatch.result }}
      ref: release/community-site
