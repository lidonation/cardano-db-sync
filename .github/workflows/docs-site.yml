name: Documentation site

on:
  push:
    branches: [master, release/community-site, docs-rebuild-spec]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-site.yml'

defaults:
  run:
    working-directory: docs

jobs:
  verify:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: No hardcoded environment values (ENV-1)
        run: npm run check:baseurl

      - name: Unit tests
        run: npm test

  build:
    name: Both build profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      # B01 DoD: both profiles build clean from one working tree, the developer output carries no
      # CNAME, the production output does, and a broken Markdown file fails the build.
      - name: Build and profile assertions
        run: npm run test:build

  # B41: publishes the developer profile to lidonation.github.io/cardano-db-sync. Deploys run only
  # from release/community-site (the fork's ENV-6 deploy branch), after both gates pass. The
  # github-pages environment must allow this branch under Settings -> Environments.
  deploy:
    name: Deploy developer site to Pages
    needs: [verify, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/community-site'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      - name: Build developer profile
        run: npm run build:dev

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/dev

      - id: deployment
        uses: actions/deploy-pages@v4
