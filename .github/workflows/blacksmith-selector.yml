name: Select Blacksmith or GitHub
on:
  workflow_call:
    outputs:
      runner:
        value: ${{ jobs.push.outputs.runner || jobs.pr.outputs.runner || 'ubuntu-24.04' }}
permissions:
  contents: read
  actions: read
jobs:
  # The environment secret must be limited to the protected release branch.
  push:
    if: >-
      github.repository == 'lidonation/cardano-db-sync' && github.event_name == 'push' &&
      github.ref == 'refs/heads/release/community-site' && vars.BLACKSMITH_SITE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: blacksmith-usage
    timeout-minutes: 3
    outputs:
      runner: ${{ steps.select.outputs.runner || 'ubuntu-24.04' }}
    steps:
      - name: Check out trusted release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
        continue-on-error: true
      - name: Decide trusted release push
        id: select
        env:
          BLACKSMITH_SITE_ENABLED: ${{ vars.BLACKSMITH_SITE_ENABLED }}
          BLACKSMITH_ORG: ${{ vars.BLACKSMITH_ORG }}
          BLACKSMITH_ORG_TOKEN: ${{ secrets.BLACKSMITH_ORG_TOKEN }}
        run: python3 .github/scripts/blacksmith-runner.py || echo 'runner=ubuntu-24.04' >> "$GITHUB_OUTPUT"
  # Never put the protected environment or vendor token on a PR job.
  pr:
    if: >-
      github.repository == 'lidonation/cardano-db-sync' && github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'release/community-site' && vars.BLACKSMITH_SITE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      runner: ${{ steps.pr.outputs.runner || 'ubuntu-24.04' }}
    steps:
      - name: Check out trusted base policy only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
        continue-on-error: true
      - name: Read trusted PR budget decision
        id: pr
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BLACKSMITH_SITE_ENABLED: ${{ vars.BLACKSMITH_SITE_ENABLED }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/blacksmith-pr-budget.py || echo 'runner=ubuntu-24.04' >> "$GITHUB_OUTPUT"
