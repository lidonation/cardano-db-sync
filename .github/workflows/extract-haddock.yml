name: Extract Haddock annotations

# B07 (CON-2), B09 (GDE-9) and B10 (CON-4) — a path-filtered extraction workflow: it runs when the
# Haskell sources it reads, the migration SQL (B09's rename map), the extractor itself, or the
# committed artifacts change, and it fails on drift between each committed artifact and a fresh
# extraction. The docs pipeline (docs-site.yml) never runs a Haskell toolchain: it only consumes the
# committed JSON (CON-1), and `check:annotations` / `check:renames` guard that the committed
# artifacts stay structurally consumable.
#
# The first run on a cold cache pays for building ghc-lib-parser once (several minutes);
# after that the build cache makes the extraction itself the whole cost — well under the
# CON-2 one-minute budget.

on:
  push:
    branches: [master, release/community-site]
    paths:
      - "cardano-db/src/**"
      - "cardano-db-sync/src/Cardano/DbSync/Config/Types.hs"
      - "cardano-db-sync/src/Cardano/DbSync/Config.hs"
      - "cardano-db-sync/app/cardano-db-sync.hs"
      - "cardano-db-sync/app/http-get-json-metadata.hs"
      - "cardano-db-sync/app/test-http-get-json-metadata.hs"
      - "cardano-db-sync/src/Cardano/DbSync/OffChain/Http.hs"
      - "cardano-db-sync/src/Cardano/DbSync/OffChain/FetchQueue.hs"
      - "cardano-smash-server/src/Cardano/SMASH/Server/Api.hs"
      - "docs/extractor/**"
      # the migration SQL the rename map is scanned from (B09)
      - "schema/**"
      - "docs/generated/**"
      - ".github/workflows/extract-haddock.yml"
  pull_request:
    paths:
      - "cardano-db/src/**"
      - "cardano-db-sync/src/Cardano/DbSync/Config/Types.hs"
      - "cardano-db-sync/src/Cardano/DbSync/Config.hs"
      - "cardano-db-sync/app/cardano-db-sync.hs"
      - "cardano-db-sync/app/http-get-json-metadata.hs"
      - "cardano-db-sync/app/test-http-get-json-metadata.hs"
      - "cardano-db-sync/src/Cardano/DbSync/OffChain/Http.hs"
      - "cardano-db-sync/src/Cardano/DbSync/OffChain/FetchQueue.hs"
      - "cardano-smash-server/src/Cardano/SMASH/Server/Api.hs"
      - "docs/extractor/**"
      # the migration SQL the rename map is scanned from (B09)
      - "schema/**"
      - "docs/generated/**"
      - ".github/workflows/extract-haddock.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: extract-haddock-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site-runner:
    name: Choose balanced runner
    uses: ./.github/workflows/blacksmith-selector.yml
    permissions:
      contents: read
      actions: read

  extract:
    name: Extract, test and diff
    needs: site-runner
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.site-runner.outputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.12.1.0"

      - name: Cache the cabal store and build directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            docs/extractor/dist-newstyle
          key: b07-${{ runner.os }}-ghc-9.6.7-${{ hashFiles('docs/extractor/cabal.project', 'docs/extractor/haddock-extractor.cabal') }}
          restore-keys: |
            b07-${{ runner.os }}-ghc-9.6.7-

      - name: Build the extractor and run its golden test
        working-directory: docs/extractor
        run: |
          cabal update
          cabal build all
          cabal test
          sh test/cli.sh "$(cabal list-bin extract-haddock)"
          sh test/renames-cli.sh "$(cabal list-bin extract-renames)"

      - name: Extract reference annotations
        working-directory: docs/extractor
        # `shell: bash` runs with `-o pipefail`, so the extractor's exit code is not
        # swallowed by `tee`; the extractor fails the step on any unparseable file.
        shell: bash
        run: |
          extractor=$(cabal list-bin extract-haddock)
          timeout 60s "$extractor" \
            --repo-root ../.. \
            --out ../generated/haddock-annotations.json \
            --input cardano-db/src \
            --input cardano-db-sync/src/Cardano/DbSync/Config/Types.hs \
            --input cardano-db-sync/app/cardano-db-sync.hs \
            --input cardano-db-sync/app/http-get-json-metadata.hs \
            --input cardano-db-sync/app/test-http-get-json-metadata.hs \
            --input cardano-db-sync/src/Cardano/DbSync/OffChain/Http.hs \
            --input cardano-db-sync/src/Cardano/DbSync/OffChain/FetchQueue.hs \
            --input cardano-smash-server/src/Cardano/SMASH/Server/Api.hs \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Extract the schema rename map (B09, GDE-9)
        working-directory: docs/extractor
        # Fails on any RENAME in schema/ the scanner cannot read, naming file and line.
        shell: bash
        run: |
          extractor=$(cabal list-bin extract-renames)
          timeout 60s "$extractor" \
            --repo-root ../.. \
            --out ../generated/schema-renames.json \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Extract the config schema (B10)
        working-directory: docs/extractor
        # Fails when a source does not parse or any part of the schema cannot be read.
        shell: bash
        run: |
          extractor=$(cabal list-bin extract-config)
          timeout 60s "$extractor" \
            --repo-root ../.. \
            --out ../generated/config-schema.json \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Drift gate (CON-2, CON-4)
        run: |
          git ls-files --error-unmatch docs/generated/haddock-annotations.json docs/generated/config-schema.json >/dev/null
          if git diff --quiet -- docs/generated/haddock-annotations.json docs/generated/config-schema.json; then
            echo "No drift: the committed artifacts match a fresh extraction."
            exit 0
          fi
          echo "::error::A committed extraction artifact has drifted from a fresh extraction."
          git --no-pager diff --stat -- docs/generated/
          git --no-pager diff -- docs/generated/ | sed -n '1,100p'
          exit 1

      - name: Rename map drift gate (CON-2)
        run: |
          git ls-files --error-unmatch docs/generated/schema-renames.json >/dev/null
          if git diff --quiet -- docs/generated/schema-renames.json; then
            echo "No drift: the committed rename map matches a fresh extraction."
            exit 0
          fi
          echo "::error::The committed schema rename map has drifted from a fresh extraction."
          git --no-pager diff -- docs/generated/schema-renames.json | sed -n '1,100p'
          exit 1
