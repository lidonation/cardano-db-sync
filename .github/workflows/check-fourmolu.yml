name: Check Fourmolu

on:
  push:
  merge_group: {}

permissions:
  contents: read
  actions: read

jobs:
  changes:
    name: Detect community-site-only changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.classify.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test change detection
        run: python3 -m unittest discover -s .github/tests -v
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          NEW_BRANCH_BASE: refs/remotes/origin/release/community-site
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/classify-ci-diff.py

  site-runner:
    name: Choose balanced runner
    needs: changes
    if: ${{ always() && needs.changes.outputs.run != 'false' }}
    uses: ./.github/workflows/blacksmith-selector.yml
    permissions:
      contents: read
      actions: read

  build:
    needs: [changes, site-runner]
    # Fail open: detection errors and non-diff events run the full checks.
    if: always() && needs.changes.outputs.run != 'false'
    runs-on: ${{ needs.site-runner.outputs.runner || 'ubuntu-24.04' }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Run fourmolu
        uses: haskell-actions/run-fourmolu@v11
        with:
          version: "0.17.0.0"
