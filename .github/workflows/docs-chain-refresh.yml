name: Chain refresh

on:
  # Check hourly, call the provider only after each network's next epoch boundary.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: chain-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Schedule and manual recovery both execute trusted default-branch code only, never PRs.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/docs-setup
      - name: Refresh configured networks
        working-directory: docs
        run: npm run chain:refresh
        env:
          BLOCKFROST_PREVIEW_PROJECT_ID: ${{ secrets.BLOCKFROST_PREVIEW_PROJECT_ID }}
          BLOCKFROST_MAINNET_PROJECT_ID: ${{ secrets.BLOCKFROST_MAINNET_PROJECT_ID }}
      - name: Commit changed public snapshots only
        id: commit
        if: ${{ !cancelled() }}
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- docs/generated/chain-preview.json docs/generated/chain-mainnet.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(docs): refresh chain snapshots'
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN commits do not fire push workflows. Explicitly rebuild/deploy the new data.
      - name: Rebuild the site with committed snapshots
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/docs-site.yml/dispatches" -f "ref=$DEFAULT_BRANCH"

  alert:
    needs: [refresh]
    if: always() && needs.refresh.result != 'skipped'
    uses: ./.github/workflows/docs-ops-alert.yml
    with:
      result: ${{ needs.refresh.result }}
    permissions:
      contents: read
      issues: write
